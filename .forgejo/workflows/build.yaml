on:
  push:

env:
  CARGO_TERM_COLOR: always
  NIX_CONFIG: "experimental-features = nix-command flakes"

jobs:
  build:
    name: build
    runs-on: codeberg-medium

    container:
      image: nixos/nix

    steps:
      - run: nix --version
      - name: Check out
        uses: https://data.forgejo.org/actions/checkout@v6
      - run: nix build -L .#pages